/* Layout: one framed game stage. A canvas draws the world, DOM panels float over it as HUD and menus. */
:root{
 --ink:#0d150b;--panel:#1f2f1a;--panel2:#2a3f23;--line:#47653a;--paper:#f3ecd2;--muted:#aab79a;
 --gold:#f2b632;--gold2:#ffd566;--rain:#5aa7d6;--bad:#e8735c;--good:#86d36f;
 --f-display:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;--f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
 color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.45 var(--f-body);overflow:hidden;
 padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
#app{height:100%}
#stage{position:relative;height:100%;border-radius:16px;overflow:hidden;border:2px solid #3d5c30;background:#7cc4ea;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1}
h3{font-size:18px;margin:18px 0 8px;color:var(--gold2)}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
kbd{font:700 12px var(--f-body);background:#0f1a0c;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--paper)}

/* sound */
.snd{position:absolute;right:12px;bottom:12px;z-index:12;display:flex;align-items:center;gap:8px;background:rgba(22,35,18,.9);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px}
.snd button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--paper);cursor:pointer;display:grid;place-items:center;padding:0}
.snd button:hover{background:#35502b}.snd svg{width:20px;height:20px}.snd .x{display:none}.snd button.off .x{display:block}.snd button.off .w{display:none}
.snd input,.vols input{accent-color:var(--gold);width:84px;cursor:pointer}
.vols{display:grid;gap:6px;font-weight:700;font-size:13px;padding:2px 2px 6px}.vols label{display:flex;justify-content:space-between;align-items:center;gap:10px}.vols input{width:140px}
@media (max-width:700px){.snd input{width:56px}}

/* goals, levels, orders, achievements */
.lvl{margin-top:2px}.lvrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}.lvrow b{font:800 14px var(--f-display);color:var(--gold2)}
.xpb{height:6px;border-radius:99px;background:#0f1a0c;border:1px solid var(--line);overflow:hidden;margin-top:3px}.xpb i{display:block;height:100%;background:linear-gradient(90deg,#f2b632,#ffd566);border-radius:99px;transition:width .4s}.xpb.big{height:12px;margin:8px 0 4px}
.hbtns{grid-template-columns:repeat(5,1fr)!important}.hbtns button{font-size:11.5px!important;padding:5px 0!important}
.hbtns button.ping{background:linear-gradient(#ffd566,#f2b632)!important;color:#2a1c04;border-color:#b57c0e;animation:ping 1.4s ease-in-out infinite}
@keyframes ping{50%{box-shadow:0 0 0 4px rgba(242,182,50,.35)}}
.quest li.rdy{color:var(--good);font-weight:700}
.sumlist .gold{color:var(--gold2)}
.item.locked{opacity:.6;border-style:dashed}.rare{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#2a1c04;border-radius:99px;padding:1px 7px;vertical-align:middle}
.orders{display:grid;gap:10px;margin:10px 0}
.ord{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.ord.ready{border-color:#78ab55;background:#2f4a27}
.ord>img{width:46px;height:46px;flex:none}.ord-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.ord-main .muted{font-size:12.5px}
.rw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}.rw b{color:var(--gold2);font:800 14px var(--f-display)}.rw em{font-style:normal;background:#0f1a0c;border:1px solid var(--line);border-radius:99px;padding:0 8px}
.ord-act{display:flex;flex-direction:column;align-items:center;gap:6px}.have{font:800 15px var(--f-display);color:var(--muted)}.have.ok{color:var(--good)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.lvbig{display:flex;gap:16px;align-items:center;margin-bottom:8px}.lvbig>div:last-child{flex:1}.lvnum{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font:800 40px var(--f-display);color:#2a1c04;background:radial-gradient(circle at 35% 30%,#ffe9a0,#f2b632 70%);border:3px solid #b57c0e;flex:none}
.lvlist{display:grid;gap:6px;margin-top:10px}.lv{display:flex;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);opacity:.65}.lv.got{opacity:1}.lv.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,182,50,.25)}
.lv>b{font:800 18px var(--f-display);width:28px;text-align:center;color:var(--gold2)}.lv>div{flex:1;display:flex;flex-direction:column;min-width:0}.lv span{font-weight:700}.lv em{font-style:normal;font-size:12.5px;color:var(--muted)}.lv i{font-style:normal;color:var(--good);font-weight:700;font-size:12.5px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.ach{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.ach.done{border-color:#78ab55;background:#2f4a27}
.ach-h{display:flex;justify-content:space-between;gap:8px}.ach-h span{color:var(--gold2);font-weight:800;font-size:13px}.ach p{margin:3px 0 6px;font-size:13px;color:var(--muted)}.ach small{font-size:12px;color:var(--muted)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.trophy{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.trophy img{width:48px;height:48px}.trophy span{font-size:12px;color:var(--muted)}.trophy.unk img{filter:grayscale(1) brightness(.35)}.trophy.unk b{color:var(--muted)}
.trophy.gold{border-color:var(--gold);background:linear-gradient(#3b3a1b,#2a3f23);box-shadow:0 0 12px rgba(242,182,50,.3)}.star{position:absolute;top:6px;right:9px;font-style:normal;color:var(--gold2);font-size:18px}
@media (max-width:700px){.ord{flex-wrap:wrap}.lvbig{flex-direction:column;align-items:flex-start}}
/* buttons */
.btn{font-weight:700;padding:10px 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--paper);cursor:pointer;transition:transform .08s,background .15s}
.btn:hover:not(:disabled){background:#35502b}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.pri{background:linear-gradient(#ffd566,#f2b632);color:#2a1c04;border-color:#b57c0e}
.btn.pri:hover:not(:disabled){background:linear-gradient(#ffe08a,#f7be40)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.card{background:rgba(22,35,18,.9);border:1px solid var(--line);border-radius:12px;padding:10px 12px;pointer-events:auto}
.hud-tl,.hud-tr{position:absolute;top:12px;display:flex;flex-direction:column;gap:8px;width:min(252px,46vw)}
.hud-tl{left:12px}.hud-tr{right:12px;align-items:stretch}
.cal-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.cal-top .pill{white-space:nowrap}#h-date{text-align:right}
.pill{display:inline-block;font:800 13px var(--f-display);padding:1px 10px;border-radius:999px;background:var(--c);color:#1b2410}
.cal-clock{display:flex;flex-direction:column;gap:3px;margin-top:4px}
#h-time{font:800 28px var(--f-display);line-height:1;white-space:nowrap}
#h-wx{display:flex;align-items:center;gap:6px;font-size:13px}
#h-fc{margin-top:4px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
#h-fc span{display:flex;align-items:center;gap:4px}
.warnt{color:var(--gold2)}
.mkt{margin-left:auto;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--gold);color:#2a1c04;white-space:nowrap}
#h-fc{flex-wrap:wrap}
.daybar{height:5px;background:#0f1a0c;border-radius:4px;margin-top:8px;overflow:hidden}
.daybar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb36b,#ffd566,#ff9a5c,#5b6ab0)}
.quest{padding:8px 12px}
.quest .qh{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:14px;color:var(--paper)}
.quest ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:12.5px}
.quest li{padding-left:20px;position:relative;color:var(--paper)}
.quest li::before{content:"";position:absolute;left:2px;top:3px;width:11px;height:11px;border:2px solid var(--line);border-radius:3px}
.quest li.done{color:var(--muted);text-decoration:line-through}
.quest li.done::before{background:var(--good);border-color:var(--good)}
.quest.min ul{display:none}
.money{display:flex;align-items:baseline;gap:4px}
.money span{font:800 18px var(--f-display);color:var(--gold)}
.money b{font:800 26px var(--f-display);color:var(--gold2)}
.bar{display:grid;grid-template-columns:52px 1fr 54px;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.bar div{height:9px;background:#0f1a0c;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5fb85a,#9be07a);transition:width .2s}
.bar.water i{background:linear-gradient(90deg,#3f8fd0,#8fd0f2)}
.bar span{text-align:right;font-variant-numeric:tabular-nums}
.lvl{margin-top:8px;font-size:12px;color:var(--muted)}
.speed{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.speed button,.hbtns button{background:#2a3f23;border:1px solid var(--line);border-radius:8px;padding:5px 0;font-weight:700;font-size:12px;cursor:pointer;color:var(--paper)}
.speed button.on{background:var(--gold);color:#2a1c04;border-color:#b57c0e}
.hbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.hbtns button:hover,.speed button:hover{background:#35502b}
#mini{position:absolute;left:12px;bottom:12px;width:160px;height:120px;border:2px solid var(--line);border-radius:10px;background:#000;pointer-events:none}
#hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;max-width:calc(100% - 360px)}
.slot{position:relative;width:56px;height:56px;border-radius:12px;background:rgba(22,35,18,.92);border:2px solid var(--line);padding:0;cursor:pointer;flex:none}
.slot img{width:42px;height:42px;display:block;margin:auto}
.slot i{position:absolute;left:5px;top:2px;font:700 11px var(--f-body);font-style:normal;color:var(--muted)}
.slot b{position:absolute;right:4px;bottom:1px;font:800 13px var(--f-display);color:var(--paper);text-shadow:0 1px 2px #000}
.slot.sel{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(255,213,102,.35),0 0 14px rgba(255,213,102,.4);background:#2f4527}
#hotname{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 1px 3px #000,0 0 6px #000;font-size:13px;display:flex;flex-direction:column;max-width:60%}
#hotname b{font:800 15px var(--f-display)}#hotname span{color:#e2e8cf}
#prompt{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);background:var(--gold);color:#2a1c04;font-weight:800;padding:5px 14px;border-radius:999px;border:2px solid #b57c0e;pointer-events:none;white-space:nowrap}
#alert{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#9c2f22;border:2px solid #ffb4a3;color:#fff;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;max-width:calc(100% - 560px);text-align:center;z-index:6}
#toasts{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:6px;align-items:center;pointer-events:none;z-index:15;width:min(520px,calc(100% - 24px))}
.toast{background:rgba(22,35,18,.95);border:1px solid var(--line);border-left:4px solid var(--rain);padding:8px 14px;border-radius:10px;font-size:14px;animation:tin .25s ease-out;transition:opacity .4s}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--gold)}
.toast.out{opacity:0}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

/* title screen */
#menu{position:absolute;inset:0;z-index:10;display:flex;align-items:center;padding:clamp(16px,5vw,64px);background:linear-gradient(90deg,rgba(9,18,7,.9) 0%,rgba(9,18,7,.55) 40%,rgba(9,18,7,0) 72%)}
.title-card{max-width:440px}
.kicker{font:700 12px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin-bottom:6px}
.title-card h1{font-weight:800;font-size:clamp(52px,9vw,104px);line-height:.88;letter-spacing:-.01em;background:linear-gradient(#fff0b0,#f2a81d 70%,#c97d0a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(60,30,0,.55)) drop-shadow(0 8px 18px rgba(0,0,0,.4))}
.title-card .tag{margin:14px 0 20px;font-size:16px;color:#e6edd2;max-width:380px}
.menu-btns{display:grid;gap:10px;width:min(280px,100%)}
.menu-btns .btn{padding:13px 18px;font-size:17px;text-align:left}
.foot{margin-top:18px;font-size:13px;color:var(--muted)}

/* modals */
#modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(7,13,5,.62)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;width:min(660px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.55);overflow:hidden}
.panel.wide{width:min(980px,100%)}.panel.narrow{width:min(430px,100%)}
.panel>header{display:flex;align-items:center;gap:12px;padding:14px 16px 12px 18px;border-bottom:1px solid var(--line)}
.panel>header>div:first-child{flex:1;min-width:0}
.panel h2{font-size:24px}
.x{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);cursor:pointer;font-size:20px;line-height:1;flex:none}
.x:hover{background:#4a3226}
.pbody{padding:14px 18px;overflow:auto;flex:1;min-height:0}
.panel>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.wallet{font:800 20px var(--f-display);color:var(--gold2);white-space:nowrap}
.menu-list{display:grid;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.item{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.item.in{border-color:#78ab55;background:#2f4a27}
.item img{width:44px;height:44px;flex:none}
.it-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.it-main b{font-size:15px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.it-buy{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.price{font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:4px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--c,#fff);border:1px solid rgba(255,255,255,.2)}
.grade{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--c);border:1px solid var(--c)}
@supports (background:color-mix(in srgb,red 10%,blue)){
 .chip{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
 .grade{background:color-mix(in srgb,var(--c) 18%,transparent)}
}
.up{color:var(--good)}.dn{color:var(--bad)}.flat{color:var(--muted)}
.banner{background:rgba(242,182,50,.15);border:1px solid var(--gold);color:var(--gold2);padding:8px 12px;border-radius:10px;margin-bottom:8px;font-weight:700}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.sellall{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.pboard{display:grid;gap:6px}
.pb-row{display:grid;grid-template-columns:26px 86px 1fr 86px 84px;gap:8px;align-items:center;font-size:13.5px}
.pb-row img{width:26px;height:26px}
.pbar{height:8px;background:#0f1a0c;border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%}
.pv{font-weight:700;font-variant-numeric:tabular-nums}.pn{color:var(--muted);font-size:12px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.bagi{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:13px}
.bagi img{width:36px;height:36px}.bagi span{flex:1}.bagi b{font-family:var(--f-display);font-size:16px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-weight:700;font-size:14px}
.fld input[type=text],textarea{background:#0f1a0c;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:400;width:100%;resize:vertical}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.swatches{display:flex;gap:10px}.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches input:checked+span{border-color:var(--gold2);box-shadow:0 0 0 2px #0f1a0c inset}
.swatches input:focus-visible+span{outline:3px solid var(--gold2);outline-offset:2px}
.keys{display:grid;gap:6px;margin-bottom:6px}
.keys>div{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 10px;background:var(--panel2);border-radius:8px;font-size:14px}
.keys>div>span:last-child{color:var(--muted);text-align:right}
.kk{display:flex;align-items:center;gap:4px;flex:none}.kk em{font-style:normal;color:var(--muted);font-size:12.5px;margin-left:4px}
.steps{margin:0 0 6px;padding-left:20px;display:grid;gap:5px}
.sum{width:min(470px,100%)}
.sunrise{height:84px;background:radial-gradient(circle at 50% 120%,#fff4b0 0 22%,transparent 23%),linear-gradient(#f59a5c,#ffd89a 65%,#9ad0ee)}
.kick{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;color:var(--gold2);margin-bottom:4px}
.wxrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.wxrow>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;background:var(--panel2);border-radius:12px;font-size:13px;color:var(--muted)}
.wxrow b{color:var(--paper);font-size:15px}
.sumlist{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:5px;font-size:14px}
.sumlist .bad{color:var(--bad)}
.tipbox{background:#16240f;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tipbox b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2)}.tipbox p{margin:4px 0 0}

/* encyclopedia */
.tabs{flex:none;display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:transparent;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--gold);border-color:#b57c0e;color:#2a1c04}
.enc-crops{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
.crop-list{display:grid;gap:4px;position:sticky;top:0}
.cl{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;border:2px solid transparent;background:var(--panel2);cursor:pointer;text-align:left;font-weight:700}
.cl img{width:30px;height:30px}.cl.on{border-color:var(--gold2);background:#35502b}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}

.dhead h3{margin:0;font-size:30px;color:var(--paper)}
.en{color:var(--gold2);font-weight:700;margin:2px 0 0}.sci{font-style:italic;color:var(--muted);margin:0;font-size:13px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats4>div{background:var(--panel2);border-radius:10px;padding:8px;text-align:center;display:flex;flex-direction:column}
.stats4 b{font:800 18px var(--f-display);color:var(--gold2)}.stats4 span{font-size:11.5px;color:var(--muted)}
.lead{font-size:16px;margin:10px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:7px 0;border-top:1px solid rgba(71,101,58,.5);font-size:14px}
.kv>b{color:var(--muted);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:12px 0}
.card2{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}
.card2 img{width:52px;height:52px}.card2 h3{margin:6px 0 2px;color:var(--paper);font-size:20px}
.card2 ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13.5px}
.eff{color:var(--good);font-weight:700}
.tbl{width:100%;border-collapse:collapse;margin:8px 0}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.wxlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}
.wxi{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:10px}.wxi p{margin:2px 0 0;font-size:13px;color:#d9e2c3}
.plain{margin:0 0 8px;padding-left:20px;display:grid;gap:5px}

/* chat */
.panel.chat{width:min(580px,100%);height:min(660px,100%)}
.kiko{display:flex;align-items:center;gap:12px}.kiko img{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold)}
.chatlog{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;line-height:1.42;font-size:14.5px;word-wrap:break-word}
.msg.kiko{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:#e8bd52;color:#2a1c04;font-weight:700;border-bottom-right-radius:4px}

  g.strokeStyle='#5aa845';g.lineWidth=1.6;g.beginPath();g.moveTo(-1,0);for(let i=1;i<=stage*3;i++)g.lineTo(i%2?3:-5,-i*(h+6)/(stage*3));g.stroke();
  for(let i=0;i<stage*2;i++)ell(g,i%2?5:-7,-4-i*(h/(stage*2)),3.6,2.2,G1,i%2?0.5:-0.5);
  if(stage===3){drawProduce(g,cr.id,6,-8,13);drawProduce(g,cr.id,-8,-14,13);drawProduce(g,cr.id,6,-19,12)}

  if(stage===3){drawProduce(g,'mais',5,-19,13);drawProduce(g,'mais',-5,-13,12);ell(g,0,-hh-1,3,5,'#e6d06a')}
 }else{

/* ---------- audio: Web Audio only, no files ---------- */
let AC=null,BUS=null,NOISE=null,RAING=null;
const AUD={mute:false,vol:.7,music:.6},AKEY='golden_harvest_audio_v1';
try{const a=JSON.parse(localStorage.getItem(AKEY)||'null');if(a){AUD.mute=!!a.mute;if(isFinite(a.vol))AUD.vol=clamp(+a.vol,0,1);if(isFinite(a.music))AUD.music=clamp(+a.music,0,1)}}catch(e){}
function audSave(){try{localStorage.setItem(AKEY,JSON.stringify(AUD))}catch(e){}}
function audio(){
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();initBus()}catch(e){AC=null;BUS=null}}
 if(AC&&AC.state==='suspended')AC.resume();
 return AC;
}
function initBus(){
 const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
 BUS={master:AC.createGain(),sfx:AC.createGain(),music:AC.createGain(),amb:AC.createGain()};
 BUS.master.connect(comp);['sfx','music','amb'].forEach(k=>BUS[k].connect(BUS.master));
 const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NOISE=b;
 applyVol();startRain();startMusic();
}
function applyVol(){if(!BUS)return;const t=AC.currentTime;BUS.master.gain.setTargetAtTime(AUD.mute?0:AUD.vol*AUD.vol,t,.03);BUS.music.gain.setTargetAtTime(AUD.music*.5,t,.1)}
function tone(f,d,type='sine',v=.05,slide=0,at=0,out){
 const a=audio();if(!a||!BUS||AUD.mute)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.012,d/4));g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(out||BUS.sfx);o.start(t);o.stop(t+d+.03);
}
function noise(d,o={}){
 const a=audio();if(!a||!BUS||AUD.mute)return;const t=a.currentTime+(o.at||0),s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();
 s.buffer=NOISE;fl.type=o.type||'lowpass';fl.frequency.setValueAtTime(o.f||800,t);if(o.slide)fl.frequency.exponentialRampToValueAtTime(Math.max(40,(o.f||800)+o.slide),t+d);fl.Q.value=o.q||1;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.v||.1,t+(o.att||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(fl);fl.connect(g);g.connect(BUS.sfx);s.start(t,Math.random()*1.5);s.stop(t+d+.05);
}
const SFX={
 till:()=>{noise(.18,{f:600,slide:-380,v:.3});tone(95,.16,'sine',.14,-45)},
 water:()=>{noise(.4,{type:'bandpass',f:1400,q:1.5,v:.12,slide:600,att:.04});for(let i=0;i<4;i++)tone(520+Math.random()*500,.07,'sine',.035,260,.04+i*.06)},
 plant:()=>{tone(300,.12,'sine',.11,220);noise(.08,{f:900,v:.05})},
 harvest:()=>{tone(523,.16,'triangle',.08);tone(784,.18,'triangle',.07,0,.07);tone(1047,.3,'sine',.05,0,.14)},
 coin:()=>{tone(988,.09,'square',.03);tone(1319,.4,'square',.03,0,.07);tone(2637,.3,'sine',.018,0,.07)},
 buy:()=>{tone(440,.1,'triangle',.07,160);tone(660,.14,'triangle',.06,0,.08)},
 step:()=>noise(.07,{f:260+Math.random()*160,v:.1,att:.003}),
 error:()=>tone(160,.2,'sawtooth',.045,-30),
 click:()=>tone(660,.045,'triangle',.045),
 thunder:()=>{noise(1.7,{f:260,slide:-170,v:.55,att:.06});tone(55,1.3,'sine',.16,-18)},
 sleep:()=>{tone(392,.3,'sine',.06);tone(330,.3,'sine',.06,0,.2);tone(262,.5,'sine',.06,0,.4)},
 eat:()=>{tone(300,.08,'triangle',.06,100);noise(.06,{f:1800,v:.06,at:.07})},
 level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.07,0,i*.09))
};
function sfx(n){try{SFX[n]&&SFX[n]()}catch(e){}}
/* rain ambience: looped noise, level follows the weather */
function startRain(){
 const s=AC.createBufferSource(),hp=AC.createBiquadFilter(),lp=AC.createBiquadFilter(),g=AC.createGain();
 s.buffer=NOISE;s.loop=true;hp.type='highpass';hp.frequency.value=700;lp.type='lowpass';lp.frequency.value=7000;g.gain.value=0;
 s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(BUS.amb);s.start();RAING=g;
}
function audioTick(){
 if(!BUS||!RAING)return;
 const r=(MODE==='play'&&S)?clamp(S.rain||0,0,1)*(S.weather==='typhoon'?.4:.28):0;
 RAING.gain.setTargetAtTime(r,AC.currentTime,.4);
}
/* soft background music: slow C-Am-F-G pads with a sparse pentatonic melody */
const CHORDS=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]],PENTA=[0,2,4,7,9],BEAT=60/66/2;
const mf=m=>440*Math.pow(2,(m-69)/12);
let MUS={next:0,beat:0,timer:0,seed:11};
function mrand(){MUS.seed=(MUS.seed*1664525+1013904223)>>>0;return MUS.seed/4294967296}
function startMusic(){if(MUS.timer)return;MUS.next=AC.currentTime+.4;MUS.timer=setInterval(musicSched,120)}
function musicSched(){
 if(!AC||!BUS||AC.state!=='running')return;
 if(MUS.next<AC.currentTime-1)MUS.next=AC.currentTime+.1;
 while(MUS.next<AC.currentTime+.6){if(!AUD.mute&&AUD.music>.01)musicBeat(MUS.next-AC.currentTime,MUS.beat);MUS.beat++;MUS.next+=BEAT}
}
function musicBeat(at,b){
 const bar=Math.floor(b/8)%4,pos=b%8,ch=CHORDS[bar];
 if(pos===0)ch.forEach(m=>tone(mf(m+12),BEAT*8.5,'sine',.05,0,at,BUS.music));
 if(pos===0)tone(mf(ch[0]),BEAT*4,'triangle',.05,0,at,BUS.music);
 const pr=[.85,.12,.5,.25,.65,.12,.45,.2][pos];
 if(mrand()<pr){const n=72+PENTA[Math.floor(mrand()*5)]+(mrand()<.25?12:0);tone(mf(n),1.1,'triangle',.045,0,at,BUS.music);tone(mf(n),.9,'sine',.014,0,at+BEAT*1.5,BUS.music)}
}

function updateSndBtn(){const b=document.getElementById('sndbtn');if(b){b.classList.toggle('off',AUD.mute);b.setAttribute('aria-pressed',AUD.mute?'true':'false');b.title=AUD.mute?'Sound is off (M)':'Sound is on (M)'}
 document.querySelectorAll('[data-vol]').forEach(el=>{const v=Math.round(AUD[el.dataset.vol]*100);if(+el.value!==v)el.value=v})}
function setMute(m){AUD.mute=m;audio();applyVol();audSave();updateSndBtn();if(!m)sfx('click')}
function setVol(k,v){AUD[k]=clamp(v,0,1);if(k==='vol'&&AUD.mute&&v>0)AUD.mute=false;audio();applyVol();audSave();updateSndBtn()}

/* ===== 04 STATE: calendar, weather, market, growth, save/load ===== */
let S=null,MODE='menu',UI=null,hotDirty=true,questDirty=true,SUMMARY=null;
const SAVE_KEY='golden_harvest_save_v1';
const calOf=day=>{const d=day-1;return{si:Math.floor(d/SEASON_LEN)%3,sd:d%SEASON_LEN+1,yr:Math.floor(d/(SEASON_LEN*3))+1,wd:d%7}};
const cal=()=>calOf(S.day);
const season=()=>SEASONS[cal().si];

function initMarket(){const m={};CROPS.forEach(c=>m[c.id]={d:1,sold:0,tr:0});return m}
function newState(name,shirt){
 const s={v:1,name:name||'Juan',shirt:shirt||'#2f78b7',money:500,energy:120,maxEnergy:120,water:40,maxWater:40,inv:{'seed:pechay':6},sel:0,
  px:9.2*TILE,py:15.7*TILE,dir:'down',time:DAY_START,day:1,speed:1,lastSpeed:1,weather:'sunny',next:'sunny',rain:0,cloud:.08,wind:.12,
  soil:new Map(),market:initMarket(),stats:{harv:{},best:{},earned:0,sold:0,planted:0,days:0,golden:0,orders:0,typhoons:0},q:{},xp:0,dayEarn:0,
  ach:{},orders:[],ordNext:2,ordSeq:0,up:{}};
 s.next=rollWeather(calOf(2).si,'sunny');return s;
}
function rollWeather(si,prev){
 const tab=WEATHER_TABLE[SEASONS[si].id];let tot=0;tab.forEach(t=>tot+=t[1]);let r=Math.random()*tot,pick='sunny';
 for(const[k,w]of tab){if((r-=w)<=0){pick=k;break}}
 if(pick==='typhoon'&&prev==='typhoon')pick='rain';return pick;
}
function wxTarget(type,t){
 const h=t/60;
 switch(type){
  case'sunny':return{rain:0,cloud:.08,wind:.12,dt:0};
  case'cloudy':return{rain:0,cloud:.6,wind:.2,dt:-2};
  case'rain':return{rain:.5+.15*Math.sin(h*1.7),cloud:.8,wind:.3,dt:-3};
  case'storm':{const f=clamp((h-12.5)/1,0,1)*clamp((19.5-h)/1,0,1);return{rain:.95*f,cloud:.3+.65*f,wind:.2+.55*f,dt:-1-3*f,thunder:f>.6}}
  case'typhoon':{const f=clamp(1-Math.abs(h-13)/10,.4,1);return{rain:.9*f,cloud:1,wind:.5+.5*f,dt:-3,thunder:f>.85}}
  case'heat':return{rain:0,cloud:0,wind:.05,dt:4};
  case'amihan':return{rain:0,cloud:.3,wind:.55,dt:-1.5};
 }
 return{rain:0,cloud:0,wind:0,dt:0};
}
function temperature(){const se=season(),h=S.time/60,c=(Math.cos((h-14)*Math.PI/12)+1)/2;return Math.round(lerp(se.tmin,se.tmax,c)+wxTarget(S.weather,S.time).dt)}
const isRaining=()=>S.rain>.3;
const clockStr=t=>{let h=Math.floor(t/60)%24,m=Math.floor(t%60/10)*10;const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+ap};

/* ----- market ----- */
function marketDaily(){CROPS.forEach(c=>{const m=S.market[c.id],old=m.d;m.d=clamp(m.d+(1-m.d)*.25+(Math.random()-.5)*.36,.72,1.38);m.tr=m.d>old+.02?1:m.d<old-.02?-1:0;m.sold*=.4})}
function priceFactor(id){const c=CROP[id],m=S.market[id],inS=c.seasons.includes(season().id);return m.d*(1-Math.min(.35,m.sold*.02))*(inS?1:1.15)*(cal().wd>=5?1.1:1)}
function priceOf(id,g){return Math.max(1,Math.round(CROP[id].price*GRADES[g].mult*priceFactor(id)))}
function profitPerDay(c){const win=12;let n,seeds;if(c.regrow){n=c.days<=win?1+Math.floor((win-c.days)/c.regrow):0;seeds=1}else{n=Math.floor(win/c.days);seeds=n}return(n*c.price-seeds*c.seed)/win}

/* ----- inventory ----- */
const inv=k=>S.inv[k]||0;
function addItem(k,n=1){S.inv[k]=(S.inv[k]||0)+n;if(S.inv[k]<=0)delete S.inv[k];hotDirty=true}
function hotItems(){
 const a=[{t:'tool',id:'hoe',name:'Hoe (Asarol)',hint:'Till grass into farmland. Clears dead crops.'},{t:'tool',id:'can',name:'Watering Can (Pandilig)',hint:'Water crops. Refill at water or the well.'},{t:'tool',id:'basket',name:'Basket (Basket)',hint:'Harvest ripe crops.'}];
 CROPS.forEach(c=>{if(inv('seed:'+c.id)>0)a.push({t:'seed',id:c.id,key:'seed:'+c.id,name:c.name+' Seeds',hint:'Plant on tilled soil.'})});
 FERTS.forEach(f=>{if(inv('fert:'+f.id)>0)a.push({t:'fert',id:f.id,key:'fert:'+f.id,name:f.name,hint:'Apply to tilled soil. '+f.effect})});
 FOODS.forEach(f=>{if(inv('food:'+f.id)>0)a.push({t:'food',id:f.id,key:'food:'+f.id,name:f.name,hint:'Eat to restore '+f.energy+' energy.'})});
 return a;
}
function curItem(){const h=hotItems();S.sel=clamp(S.sel,0,h.length-1);return h[S.sel]}
function cycleItem(d){const h=hotItems();S.sel=(S.sel+d+h.length)%h.length;hotDirty=true;sfx('click')}

/* ----- quests, xp ----- */
function quest(id){if(S.q[id])return;S.q[id]=1;questDirty=true;const q=QUESTS.find(x=>x[0]===id);if(q)toast('Task done: '+q[1],'good')}
const lvl=()=>Math.min(12,Math.floor(Math.sqrt(S.xp/12))+1);
function addXp(n){const o=lvl();S.xp+=n;for(let l=o+1;l<=lvl();l++)levelUp(l);checkAch()}

/* ----- time and weather advance ----- */
let flash=0,wTick=0;
function advanceTime(dt){
 if(S.speed>0)S.time+=dt*3*S.speed;
 const w=wxTarget(S.weather,S.time),k=1-Math.exp(-dt*.7*Math.max(1,S.speed));
 S.rain+=(w.rain-S.rain)*k;S.cloud+=(w.cloud-S.cloud)*k;S.wind+=(w.wind-S.wind)*k;
 wTick+=dt;if(wTick>=.8){wTick=0;if(S.rain>.3)S.soil.forEach(s=>{s.w=1})}
 if(w.thunder&&S.speed>0&&Math.random()<dt*.15*Math.min(2,S.speed)){flash=1;setTimeout(()=>sfx('thunder'),250+Math.random()*500)}
 flash=Math.max(0,flash-dt*3);
 if(S.time>=DAY_END)endDay(true);
}

/* ----- end of day: crops grow, weather rolls, market updates ----- */
function endDay(pass){
 const sid=season().id;let grown=0,withered=0,destroyed=0,ready=0;const typhoon=S.weather==='typhoon';
 S.soil.forEach(s=>{
  const c=s.c;
  if(c&&!c.dead){
   if(typhoon&&Math.random()<.22){s.c=null;s.f=null;destroyed++}
   else{const cr=CROP[c.id];
    if(c.gp<cr.days){c.n++;
     if(s.w){const inS=cr.seasons.includes(sid);let g=inS?1:.6;const f=s.f&&FERT[s.f];if(f&&f.speed&&Math.random()<f.speed)g+=1;c.gp+=g;c.wd++;c.dry=0;if(inS)c.sd++;grown++}
     else{c.dry++;if(c.dry>=3){c.dead=true;withered++}}
    }
    if(!c.dead&&c.gp>=cr.days)ready++;
   }
  }
  s.w=0;
 });
 const oldSeason=cal().si,oldWx=S.weather,notes=[];if(typhoon)S.stats.typhoons=(S.stats.typhoons||0)+1;
 S.day++;S.stats.days++;S.weather=S.next;S.next=rollWeather(calOf(S.day+1).si,S.weather);marketDaily();
 S.energy=pass?Math.round(S.maxEnergy*.6):S.maxEnergy;S.water=S.maxWater;S.time=pass?DAY_START+60:DAY_START;
 const w=wxTarget(S.weather,S.time);S.rain=w.rain*.6;S.cloud=w.cloud;S.wind=w.wind;
 S.px=9.2*TILE;S.py=15.7*TILE;S.dir='down';
 SUMMARY={pass,grown,withered,destroyed,ready,earn:S.dayEarn,oldWx,newSeason:cal().si!==oldSeason};S.dayEarn=0;
 orderTick(notes);SUMMARY.notes=notes;checkAch();
 quest('sleep');saveGame(true);hotDirty=true;
 sfx('sleep');showSummary();
}

/* ----- save / load ----- */
function serialize(){const o=Object.assign({},S);o.soil=[...S.soil.entries()];return JSON.stringify(o)}
function parseSave(str){const o=JSON.parse(str);if(!o||typeof o!=='object'||!Array.isArray(o.soil)||typeof o.day!=='number')throw new Error('bad save');
 const base=newState(o.name,o.shirt);const s=Object.assign(base,o);s.soil=new Map(o.soil);s.stats=Object.assign(base.stats,o.stats||{});s.market=Object.assign(initMarket(),o.market||{});s.inv=o.inv||{};s.q=o.q||{};s.ach=o.ach||{};s.orders=o.orders||[];s.up=o.up||{};return s}
function saveGame(silent){try{localStorage.setItem(SAVE_KEY,serialize());if(!silent)toast('Game saved.','good');return true}catch(e){if(!silent)toast('Saving is blocked in this browser. Use Export Save Code in the pause menu.','bad');return false}}
function hasSave(){try{return!!localStorage.getItem(SAVE_KEY)}catch(e){return false}}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;S=parseSave(raw);return true}catch(e){return false}}
const exportCode=()=>btoa(unescape(encodeURIComponent(serialize())));
function importCode(code){try{S=parseSave(decodeURIComponent(escape(atob(code.trim()))));return true}catch(e){return false}}

/* scenery crops shown behind the title screen */
function demoFarm(st){
 const rows=[['pechay',3],['talong',2],['kamatis',3],['sitaw',3],['mais',2],['kalabasa',3],['okra',1],['kamote',2]];
 rows.forEach(([id,stg],r)=>{for(let x=14;x<=29;x++){const y=18+r;const cr=CROP[id],gp=stg>=3?cr.days:cr.days*(stg===2?.7:stg===1?.4:0.05);
  st.soil.set(ti(x,y),{w:1,f:null,c:{id,gp:gp+(x%3===0&&stg<3?cr.days*.08:0),n:4,wd:4,sd:4,dry:0,dead:false}})}});
}

/* ----- farm statistics (also used by the AI farmer) ----- */
function farmStats(){let alive=0,ready=0,dry=0,dead=0;S.soil.forEach(s=>{const c=s.c;if(!c)return;if(c.dead){dead++;return}alive++;if(c.gp>=CROP[c.id].days)ready++;else if(!s.w&&!isRaining())dry++});return{alive,ready,dry,dead,tilled:S.soil.size}}

/* ===== 05 ACTIONS: player, tools, interactions, ambient life ===== */
const keys={};const mouse={x:0,y:0,active:false};const cam={x:0,y:0};let camX=0,camY=0,Z=1;
const DIRV={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
const P={anim:0,moving:false,cool:0,swing:0,toolT:0};
const floats=[],parts=[],BUTTERFLIES=[];
function addFloat(x,y,txt,col='#fff'){floats.push({x,y,txt,col,t:0})}
function puff(tx,ty,col){for(let i=0;i<7;i++)parts.push({x:tx*TILE+16,y:ty*TILE+18,vx:rnd(-40,40),vy:rnd(-60,-15),t:0,life:rnd(.35,.6),col,s:rnd(1.5,3)})}

const blocked=(px,py)=>{const x=Math.floor(px/TILE),y=Math.floor(py/TILE);if(!inb(x,y))return true;const i=ti(x,y),g=G[i];return g===WATER||g===PADDY||g===HILL||SOL[i]===1};
const canStand=(x,y)=>!(blocked(x-7,y-4)||blocked(x+7,y-4)||blocked(x-7,y+3)||blocked(x+7,y+3));

function updatePlayer(dt){
 let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
 P.cool=Math.max(0,P.cool-dt);P.swing=Math.max(0,P.swing-dt);P.toolT=Math.max(0,P.toolT-dt);
 if(dx||dy){
  const l=Math.hypot(dx,dy);dx/=l;dy/=l;const sp=118*(keys.run?1.6:1)*(S.energy<=0?.6:1);
  const mx=dx*sp*dt,my=dy*sp*dt;
  const ox=S.px,oy=S.py;if(canStand(S.px+mx,S.py))S.px+=mx;if(canStand(S.px,S.py+my))S.py+=my;
  P.stepD=(P.stepD||0)+Math.hypot(S.px-ox,S.py-oy);if(P.stepD>(keys.run?30:24)){P.stepD=0;sfx('step')}
  if(Math.abs(dx)>Math.abs(dy)||(Math.abs(dx)===Math.abs(dy)&&(S.dir==='left'||S.dir==='right')))S.dir=dx<0?'left':'right';else S.dir=dy<0?'up':'down';
  P.moving=true;P.anim+=dt*(keys.run?12:8);mouse.active=false;
 }else{P.moving=false;P.anim=0}
 if(keys.use||keys.mouse)useInput();
}
function facingTile(){const d=DIRV[S.dir];return{x:Math.floor((S.px+d[0]*20)/TILE),y:Math.floor((S.py-6+d[1]*22)/TILE),far:false}}
/* is the tile under the cursor something the selected item can act on? */
function tileUseful(t,it){
 if(!it||!inb(t.x,t.y))return false;const k=ti(t.x,t.y),s=S.soil.get(k);
 if(it.t==='tool'&&it.id==='hoe')return s?!!(s.c&&s.c.dead):(G[k]===GR&&!SOL[k]&&!FEN[k]);
 if(it.t==='tool'&&it.id==='can')return G[k]===WATER||(t.x===13&&t.y===17)||(!!s&&!s.w);
 if(it.t==='tool'&&it.id==='basket')return !!(s&&s.c&&!s.c.dead&&s.c.gp>=CROP[s.c.id].days);
 if(it.t==='seed')return !!s&&!s.c;
 if(it.t==='fert')return !!s&&!s.f;
 return false;
}
function targetTile(){
 if(mouse.active){const tx=Math.floor((camX+mouse.x/Z)/TILE),ty=Math.floor((camY+mouse.y/Z)/TILE);const d=Math.hypot(tx*TILE+16-S.px,ty*TILE+16-(S.py-8));return{x:tx,y:ty,far:d>2.7*TILE}}
 return facingTile();
}
function useInput(){
 if(P.cool>0)return;const t=targetTile();
 if(t.far){toast('Too far. Walk closer to that tile.');P.cool=.4;return}
 const cx=t.x*TILE+16-S.px,cy=t.y*TILE+16-(S.py-8);if(mouse.active){S.dir=Math.abs(cx)>Math.abs(cy)?(cx<0?'left':'right'):(cy<0?'up':'down')}
 P.cool=.3;P.swing=.2;P.toolT=.36;useAt(t.x,t.y);
}
function spend(n){const c=Math.ceil(n*(S.weather==='heat'?1.5:1));if(S.energy<c){toast('Too tired! Eat something or sleep in your bahay kubo.','bad');sfx('error');return false}S.energy-=c;return true}
function refillCan(){S.water=S.maxWater;sfx('water');toast('Watering can refilled.');hotDirty=true}

function useAt(tx,ty){
 const it=curItem();if(!it||!inb(tx,ty))return;
 const k=ti(tx,ty),soil=S.soil.get(k);
 if(it.t==='food'){addItem(it.key,-1);S.energy=Math.min(S.maxEnergy,S.energy+FOOD[it.id].energy);sfx('eat');toast('Yum! +'+FOOD[it.id].energy+' energy.','good');return}
 if(it.t==='tool'&&it.id==='hoe'){
  if(soil){
   if(soil.c&&soil.c.dead){soil.c=null;soil.f=null;puff(tx,ty,'#8a6b3a');toast('Cleared the withered crop.');sfx('till');return}
   toast(soil.c?'A crop is growing here.':'This soil is already tilled.');return;
  }
  if(G[k]!==GR||SOL[k]||FEN[k]){toast("You can't till here.");sfx('error');return}
  if(!spend(2))return;
  S.soil.set(k,{w:isRaining()?1:0,f:null,c:null});quest('till');sfx('till');puff(tx,ty,'#8a5a2e');return;
 }
 if(it.t==='tool'&&it.id==='can'){
  if(G[k]===WATER||(tx===13&&ty===17)){refillCan();return}
  if(!soil){toast('Nothing to water here. Till the soil first.');return}
  if(S.water<=0){toast('The can is empty. Refill at the river, pond or well.','bad');sfx('error');return}
  if(soil.w){toast('Already watered.');return}
  if(!spend(1))return;S.water--;soil.w=1;quest('water');sfx('water');puff(tx,ty,'#7fbfe8');return;
 }
 if(it.t==='tool'&&it.id==='basket'){if(!soil||!soil.c)toast('Nothing to harvest here.');else harvestSoil(soil,tx,ty);return}
 if(it.t==='seed'){
  if(!soil){toast('Till the soil with the Hoe first.');sfx('error');return}
  if(soil.c){toast(soil.c.dead?'Clear the withered crop with the Hoe.':'Something is already planted here.');sfx('error');return}
  const cr=CROP[it.id];addItem(it.key,-1);soil.c={id:it.id,gp:0,n:0,wd:0,sd:0,dry:0,dead:false};S.stats.planted++;quest('plant');sfx('plant');puff(tx,ty,'#6cbf5a');
  if(!cr.seasons.includes(season().id))toast(cr.name+' is out of season here. It grows slower but sells 15% higher.','warn');
  return;
 }
 if(it.t==='fert'){
  if(!soil){toast('Fertilize tilled soil. Use the Hoe first.');sfx('error');return}
  if(soil.f){toast('This tile is already fertilized.');sfx('error');return}
  soil.f=it.id;addItem(it.key,-1);quest('fert');sfx('plant');puff(tx,ty,FERT[it.id].col);toast(FERT[it.id].name+' applied.','good');return;
 }
}
function harvestSoil(soil,tx,ty){
 const c=soil&&soil.c;if(!c)return false;
 if(c.dead){toast('This crop withered. Use the Hoe to clear it.');return false}
 const cr=CROP[c.id];
 if(c.gp<cr.days){toast(cr.name+' is not ripe yet. About '+Math.ceil(cr.days-c.gp)+' more watered day(s).');sfx('error');return false}
 const wr=c.n?c.wd/c.n:1,sr=c.wd?c.sd/c.wd:0,fq=soil.f?FERT[soil.f].q:0;
 const q=wr*.35+fq+sr*.1+Math.random()*.15+(lvl()-1)*.012;
 const g=q>=.9?3:q>=.65?2:q>=.4?1:0;
 addItem('crop:'+c.id+':'+g,1);
 S.stats.harv[c.id]=(S.stats.harv[c.id]||0)+1;if(g>(S.stats.best[c.id]??-1))S.stats.best[c.id]=g;if(g===3)S.stats.golden++;
 addXp(4+g*3);quest('harvest');sfx('harvest');puff(tx,ty,GRADES[g].col);
 addFloat(tx*TILE+16,ty*TILE-4,'+1 '+cr.name+' · '+GRADES[g].name,GRADES[g].col);
 if(cr.regrow){c.gp=cr.days-cr.regrow;c.n=0;c.wd=0;c.sd=0;c.dry=0}else{soil.c=null;soil.f=null}
 return true;
}

/* ----- interactions (E key) ----- */
function interactables(){
 const L=[];
 NPCS.forEach(n=>L.push({label:n.label,x:n.x,y:n.y-6,r:n.r,go:()=>talkTo(n)}));
 L.push({label:'Sleep in your bahay kubo',x:POI.door.x,y:POI.door.y,r:62,go:()=>openSleep()});
 L.push({label:'Read the Encyclopedia board',x:POI.boardP.x,y:POI.boardP.y,r:68,go:()=>openEncyclopedia()});
 L.push({label:'Refill watering can at the well',x:POI.wellP.x,y:POI.wellP.y,r:62,go:()=>refillCan()});
 return L;
}
function nearestInteract(){let best=null,bd=1e9;const px=S.px,py=S.py-8;for(const it of interactables()){const d=Math.hypot(it.x-px,it.y-py);if(d<it.r&&d<bd){bd=d;best=it}}return best}
function interact(){
 const t=targetTile();
 if(!t.far&&inb(t.x,t.y)){const s=S.soil.get(ti(t.x,t.y));if(s&&s.c&&!s.c.dead&&s.c.gp>=CROP[s.c.id].days){harvestSoil(s,t.x,t.y);return}}
 const it=nearestInteract();if(it){sfx('click');it.go();return}
 toast('Nothing to interact with here.');
}
function talkTo(n){
 if(n.role==='shop')openShop();else if(n.role==='market')openMarket();else openChat();
}

/* ----- ambient life ----- */
function stepEntity(a,dt,sp,ok){
 if(a.wait>0){a.wait-=dt;a.moving=false;return}
 if(!a.tx&&!a.ty){const ang=Math.random()*6.283,r=Math.random()*a.r;a.tx=a.hx+Math.cos(ang)*r;a.ty=a.hy+Math.sin(ang)*r*.8}
 const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);
 if(d<3){a.tx=a.ty=0;a.wait=1.5+Math.random()*4;a.moving=false;return}
 const nx=a.x+dx/d*sp*dt,ny=a.y+dy/d*sp*dt;
 if(ok(nx,ny)){a.x=nx;a.y=ny;a.moving=true;a.anim+=dt*6;a.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}
 else{a.tx=a.ty=0;a.wait=.6;a.moving=false}
}
const onWater=(x,y)=>gt(Math.floor(x/TILE),Math.floor(y/TILE))===WATER;
function initButterflies(){BUTTERFLIES.length=0;for(let i=0;i<14;i++)BUTTERFLIES.push({x:rnd(8,36)*TILE,y:rnd(11,38)*TILE,a:rnd(0,6.28),ph:rnd(0,6),c:pick(['#ffd84a','#ff9ec4','#ffffff','#9ad0ff'])})}
function updateWorld(dt){
 NPCS.forEach(n=>{if(!n.still)stepEntity(n,dt,22,canStand)});
 ANIMALS.forEach(a=>stepEntity(a,dt,a.sp,a.water?onWater:canStand));
 BUTTERFLIES.forEach(b=>{b.a+=(Math.random()-.5)*dt*7;b.ph+=dt*14;const sp=22;b.x=clamp(b.x+Math.cos(b.a)*sp*dt,7*TILE,36*TILE);b.y=clamp(b.y+Math.sin(b.a)*sp*dt,11*TILE,39*TILE)});
 for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.y-=22*dt;if(f.t>1.5)floats.splice(i,1)}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;if(p.t>p.life)parts.splice(i,1)}
}

function heldTool(){if(MODE!=='play')return null;const it=curItem();return it&&it.t==='tool'?it.id:null}
/* tool in the player's hand: asarol (hoe) swings down, the watering can tilts and pours */
function drawTool(g,tool,hx,hy,face,p){
 g.save();g.translate(hx,hy);g.scale(face,1);
 if(tool==='hoe'){
  const rot=p<0?.9:p<.3?lerp(.9,-.25,p/.3):p<.7?lerp(-.25,2.1,(p-.3)/.4):lerp(2.1,.9,(p-.7)/.3);
  g.rotate(rot);g.strokeStyle='#7a4e22';g.lineWidth=2.4;g.lineCap='round';g.beginPath();g.moveTo(0,5);g.lineTo(0,-17);g.stroke();
  g.fillStyle='#b9c0c6';g.strokeStyle='#6b747b';g.lineWidth=.8;g.beginPath();g.moveTo(-1.5,-19);g.lineTo(6.5,-18.5);g.lineTo(7,-12.5);g.lineTo(3.2,-14);g.lineTo(-1.5,-14.5);g.closePath();g.fill();g.stroke();
 }else if(tool==='can'){
  const rot=p<0?0:p<.25?lerp(0,1.0,p/.25):p<.8?1.0:lerp(1.0,0,(p-.8)/.2);
  g.rotate(rot);g.translate(0,-2);
  g.strokeStyle='#2f6fa6';g.lineWidth=1.6;g.beginPath();g.arc(-5.5,-2,3.4,Math.PI*.5,Math.PI*1.5);g.stroke();
  g.strokeStyle='#3d86c0';g.lineWidth=2;g.beginPath();g.moveTo(4,0);g.lineTo(11,-7);g.stroke();rrect(g,9.2,-9.6,4.4,2.6,1,'#3d86c0');
  rrect(g,-5,-6,10,9,2.2,'#58a6e0');rrect(g,-5,-6,10,2.4,1.2,'#7fc0ee');
  if(p>=.2&&p<.85){g.fillStyle='rgba(150,210,255,.9)';for(let i=0;i<4;i++){const q=((p*5+i*.27)%1);g.fillRect(12.5+q*3,-8+q*(14+i*2),1.4,1.4+q)}}
 }else if(tool==='basket'){
  g.translate(0,p<0?0:-Math.sin(p*Math.PI)*2);rrect(g,-6,-6,12,8,2.4,'#b98a4a');g.strokeStyle='#8a6128';g.lineWidth=.8;
  for(let i=-4;i<=4;i+=2.7){g.beginPath();g.moveTo(i,-6);g.lineTo(i,2);g.stroke()}g.beginPath();g.moveTo(-6,-2.5);g.lineTo(6,-2.5);g.stroke();
  g.strokeStyle='#8a6128';g.lineWidth=1.6;g.beginPath();g.arc(0,-6,5.5,Math.PI,0);g.stroke();
 }
 g.restore();
}

 g.save();g.translate(x,y);ell(g,0,1,8,3,'rgba(0,0,0,.25)');g.translate(dv[0]*so,dv[1]*so*.6);

 rrect(g,side?-4.5:-6.5,-20-bob,side?9:13,12,3,pal.shirt);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(side?-4.5:-6.5,-12-bob,side?9:13,3);
 if(dir==='up'||!pal.skin){}

function drawChicken(g,a,T){g.save();g.translate(a.x,a.y);if(a.dir==='right')g.scale(-1,1);const peck=a.moving?0:Math.max(0,Math.sin(T*6+a.anim))*2;

function drawCrop(tx,ty,c,T){
 let spr,ripe=false;
 if(c.dead)spr=plantSprite('dead',-1);else{const cr=CROP[c.id];ripe=c.gp>=cr.days;spr=plantSprite(c.id,ripe?3:Math.min(2,Math.floor(c.gp/cr.days*3)))}
 ctx.drawImage(spr,tx*TILE-4,ty*TILE-16,40,48);
 if(ripe){const bx=tx*TILE+16,by=ty*TILE-14+Math.sin(T*3+tx)*2;ctx.fillStyle='#ffd34a';ctx.beginPath();ctx.moveTo(bx,by-5);ctx.lineTo(bx+3.5,by);ctx.lineTo(bx,by+5);ctx.lineTo(bx-3.5,by);ctx.closePath();ctx.fill();ctx.strokeStyle='#a66d0a';ctx.lineWidth=1;ctx.stroke()}
}

const ents=[];
function render(T,dt){
 const w=CW/Z,h=CH/Z;
 cam.x=clamp(cam.x,w/2,MW*TILE-w/2);cam.y=clamp(cam.y,h/2,MH*TILE-h/2);
 camX=Math.max(0,Math.min(MW*TILE-w,cam.x-w/2));camY=Math.max(0,Math.min(MH*TILE-h,cam.y-h/2));
 ctx.setTransform(DPR*Z,0,0,DPR*Z,-camX*DPR*Z,-camY*DPR*Z);ctx.imageSmoothingEnabled=true;
 ctx.drawImage(BASE,camX*SS,camY*SS,w*SS,h*SS,camX,camY,w,h);
 const tx0=Math.max(0,Math.floor(camX/TILE)-1),tx1=Math.min(MW-1,Math.ceil((camX+w)/TILE)),ty0=Math.max(0,Math.floor(camY/TILE)-1),ty1=Math.min(MH-1,Math.ceil((camY+h)/TILE)+3);
 /* water shimmer */
 ctx.strokeStyle='rgba(255,255,255,.34)';ctx.lineWidth=1.4;ctx.beginPath();
 for(let y=ty0;y<=Math.min(MH-1,ty1);y++)for(let x=tx0;x<=tx1;x++){if(G[ti(x,y)]!==WATER)continue;const ph=T*1.5+x*.8+y*.6;const ox=x*TILE+5+Math.sin(ph)*6,oy=y*TILE+9+Math.cos(ph*.7)*3;ctx.moveTo(ox,oy);ctx.lineTo(ox+10,oy);const ox2=x*TILE+16+Math.cos(ph)*6,oy2=y*TILE+22+Math.sin(ph*.8)*3;ctx.moveTo(ox2,oy2);ctx.lineTo(ox2+9,oy2)}
 ctx.stroke();
 /* soil */
 for(let y=ty0;y<=ty1;y++)for(let x=tx0;x<=tx1;x++){const s=S.soil.get(ti(x,y));if(!s)continue;const sp=s.w?SOILSPR.wet:SOILSPR.dry;ctx.drawImage(sp,x*TILE,y*TILE,TILE,TILE);
  if(s.f){ctx.fillStyle=FERT[s.f].col;for(let i=0;i<6;i++)ctx.fillRect(x*TILE+3+hash2(x,y,i)*24,y*TILE+3+hash2(x,y,i+9)*24,2.4,2.4)}}
 /* entities */
 ents.length=0;
 if(MODE==='play')ents.push({y:S.py,p:1});
 NPCS.forEach(n=>ents.push({y:n.y,n}));ANIMALS.forEach(a=>{if(!a.water)ents.push({y:a.y,a})});
 ents.sort((a,b)=>a.y-b.y);let ei=0;
 const draw=e=>{if(e.p)drawPerson(ctx,S.px,S.py,S.dir,P.anim,P.moving,{skin:'#c98d5e',shirt:S.shirt,pants:'#4a4560',hat:'salakot',hair:'#2a1f18'},P.swing,heldTool(),P.toolT>0?1-P.toolT/.36:-1);
  else if(e.n)drawPerson(ctx,e.n.x,e.n.y,e.n.dir,e.n.anim,e.n.moving,e.n.pal,0);
  else if(e.a.k==='carabao')drawCarabao(ctx,e.a);else drawChicken(ctx,e.a,T)};
 for(let y=ty0;y<=ty1;y++){
  for(const o of ROWS[y]){if(o.ox+o.s.lw<camX||o.ox>camX+w)continue;ctx.drawImage(o.s,o.ox,o.oy,o.s.lw,o.s.lh)}
  for(let x=tx0;x<=tx1;x++){const s=S.soil.get(ti(x,y));if(s&&s.c)drawCrop(x,y,s.c,T)}
  while(ei<ents.length&&Math.floor(ents[ei].y/TILE)<=y){draw(ents[ei]);ei++}
 }
 ANIMALS.forEach(a=>{if(a.water)drawDuck(ctx,a,T)});
 /* target highlight */
 if(MODE==='play'&&!UI&&(!P.moving||mouse.active||keys.use)){const t=targetTile();if(!t.far&&inb(t.x,t.y)&&tileUseful(t,curItem())){const s=S.soil.get(ti(t.x,t.y));const ripe=s&&s.c&&!s.c.dead&&s.c.gp>=CROP[s.c.id].days;ctx.strokeStyle=ripe?'#ffd34a':'rgba(255,255,255,'+(.55+.25*Math.sin(T*6))+')';ctx.lineWidth=2;ctx.strokeRect(t.x*TILE+1,t.y*TILE+1,TILE-2,TILE-2);ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(t.x*TILE,t.y*TILE,TILE,TILE)}}
 const day=lightAt(S.time/60)[3];
 if(day<.4&&S.time>=300){BUTTERFLIES.forEach(b=>{if(b.x>camX-20&&b.x<camX+w+20&&b.y>camY-20&&b.y<camY+h+20)drawButterfly(ctx,b)})}
 parts.forEach(p=>{ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.s,p.s)});ctx.globalAlpha=1;
 ctx.font='bold 13px system-ui,Segoe UI,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(20,30,15,.85)';
 floats.forEach(f=>{ctx.globalAlpha=clamp(1.5-f.t,0,1);ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y)});ctx.globalAlpha=1;ctx.textAlign='left';
 /* screen-space lighting and weather */
 ctx.setTransform(DPR,0,0,DPR,0,0);
 const[lr,lg,lb,la]=lightAt(S.time/60);
 if(la>0.005){ctx.fillStyle=`rgba(${lr|0},${lg|0},${lb|0},${la})`;ctx.fillRect(0,0,CW,CH)}
 if(la>.3){ctx.globalCompositeOperation='lighter';for(let i=0;i<22;i++){const fx=((hash2(i,3)*CW+Math.sin(T*.3+i)*30)%CW+CW)%CW,fy=((hash2(i,4)*CH+Math.cos(T*.4+i*2)*24)%CH+CH)%CH,a=(.5+.5*Math.sin(T*2.2+i*1.7))*.7;const gr=ctx.createRadialGradient(fx,fy,0,fx,fy,7);gr.addColorStop(0,`rgba(255,240,140,${a})`);gr.addColorStop(1,'rgba(255,240,140,0)');ctx.fillStyle=gr;ctx.fillRect(fx-7,fy-7,14,14)}ctx.globalCompositeOperation='source-over'}
 if(S.cloud>.02){const dark=S.cloud*.2+(S.weather==='typhoon'?.12:0)+(S.rain>.6?.08:0);ctx.fillStyle=`rgba(60,74,92,${dark})`;ctx.fillRect(0,0,CW,CH)}
 if(S.weather==='heat'&&la<.2){ctx.fillStyle='rgba(255,196,70,.10)';ctx.fillRect(0,0,CW,CH);const gr=ctx.createRadialGradient(CW*.9,0,10,CW*.9,0,CW*.6);gr.addColorStop(0,'rgba(255,245,190,.30)');gr.addColorStop(1,'rgba(255,245,190,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,CW,CH)}
 if(S.weather==='amihan'&&la<.2){ctx.fillStyle='rgba(150,200,235,.07)';ctx.fillRect(0,0,CW,CH)}
 if(S.rain>.03){
  const n=Math.floor(RAIN.length*clamp(S.rain/.9,0,1)),sl=.18+S.wind*.5;ctx.strokeStyle='rgba(205,225,255,.5)';ctx.lineWidth=1.3;ctx.beginPath();
  for(let i=0;i<n;i++){const d=RAIN[i];d.y+=d.s*dt;d.x+=d.s*sl*dt*.6;if(d.y>CH+20){d.y=-30;d.x=Math.random()*(CW+200)-100}if(d.x>CW+100)d.x=-100;ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.l*sl*.6,d.y-d.l)}
  ctx.stroke();
 }
 if(S.wind>.75){const n=Math.floor(LEAVES.length*clamp((S.wind-.7)*3,0,1));for(let i=0;i<n;i++){const l=LEAVES[i];l.x+=l.s*dt;l.y+=l.s*.25*dt+Math.sin(T*3+i)*1.5;l.r+=dt*6;if(l.x>CW+30){l.x=-30;l.y=Math.random()*CH}if(l.y>CH)l.y=-10;ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.r);ell(ctx,0,0,5,2.2,i%3?'#4f9a45':'#8a6b3a');ctx.restore()}}
 if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.55})`;ctx.fillRect(0,0,CW,CH)}
 if(VIG)ctx.drawImage(VIG,0,0,CW,CH);
}

function toast(msg,kind=''){const c=$('#toasts');if(!c)return;const last=c.lastElementChild;if(last&&last.textContent===msg&&!last.classList.contains('out')){last.style.animation='none';void last.offsetWidth;last.style.animation='';return}const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;c.appendChild(d);while(c.children.length>4)c.firstChild.remove();setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),400)},3300)}

/* ----- game flow ----- */
function startPlay(){MODE='play';UI=null;$('#modal').hidden=true;$('#menu').hidden=true;$('#hud').hidden=false;cam.x=S.px;cam.y=S.py;hotDirty=true;questDirty=true;Object.keys(hc).forEach(k=>delete hc[k]);S.speed=S.speed||1;updateHud()}

function kikoTip(){
 const fs=farmStats();
 if(S.next==='typhoon')return'Bagyo is coming tomorrow. Harvest your ripe crops today, because each crop has a 22% chance of being destroyed.';
 if(S.weather==='typhoon')return'The typhoon is passing today. Nothing to do but wait it out. Check which crops survived.';
 if(fs.ready>0)return`You have ${fs.ready} ripe crop${fs.ready>1?'s':''} ready. Look for the gold star and press E to harvest.`;
 if(fs.dead>0)return'Some crops withered from lack of water. Clear them with the Hoe and replant.';
 if(fs.dry>0&&!isRaining())return`${fs.dry} crop${fs.dry>1?'s':''} need water today. Fill the can at the well first.`;
 if(cal().wd>=5)return'It is a weekend. The Palengke pays about 10% more today.';
 return pick(TIPS);
}

/* ----- market ----- */
function sellQuiet(key,n){const[,id,g]=key.split(':');n=Math.min(n,inv(key));if(n<=0)return 0;let total=0;for(let i=0;i<n;i++){total+=priceOf(id,+g);S.market[id].sold++}addItem(key,-n);S.money+=total;S.dayEarn+=total;S.stats.earned+=total;S.stats.sold+=n;checkAch();return total}
function sell(key,n){const[,id,g]=key.split(':');n=Math.min(n,inv(key));const t=sellQuiet(key,n);if(t){sfx('coin');quest('sell');toast(`Sold ${n} ${CROP[id].name} (${GRADES[+g].name}) for ${peso(t)}`,'good')}}
function openMarket(){openModal('market',renderMarket)}
function renderMarket(){
 const keys=Object.keys(S.inv).filter(k=>k.startsWith('crop:')).sort((a,b)=>CROPS.findIndex(c=>c.id===a.split(':')[1])-CROPS.findIndex(c=>c.id===b.split(':')[1])||(+b.split(':')[2])-(+a.split(':')[2]));
 let total=0;
 const rows=keys.map(k=>{const[,id,g]=k.split(':'),n=inv(k),m=S.market[id];let sim=0,sold=m.sold;for(let i=0;i<n;i++){sim+=Math.max(1,Math.round(CROP[id].price*GRADES[+g].mult*m.d*(1-Math.min(.35,sold*.02))*(CROP[id].seasons.includes(season().id)?1:1.15)*(cal().wd>=5?1.1:1)));sold++}total+=sim;
  const tr=m.tr>0?'<span class="up">▲</span>':m.tr<0?'<span class="dn">▼</span>':'<span class="flat">–</span>';
  return`<div class="item"><img src="${iconURL('crop:'+id)}" alt=""><div class="it-main"><b>${CROP[id].name}</b><span class="muted">${gradeBadge(+g)} · you have ${n}</span></div><div class="it-buy"><span class="price">${peso(priceOf(id,+g))} ${tr}</span><div class="btnrow"><button class="btn sm" data-act="sell" data-k="${k}" data-n="1">Sell 1</button><button class="btn sm ghost" data-act="sell" data-k="${k}" data-n="${n}">All (${peso(sim)})</button></div></div></div>`}).join('');
 const board=CROPS.map(c=>{const f=priceFactor(c.id),m=S.market[c.id],inS=c.seasons.includes(season().id);return`<div class="pb-row"><img src="${iconURL('crop:'+c.id)}" alt=""><b>${c.name}</b><span class="pbar"><i style="width:${clamp((f-.5)/1.2,0.05,1)*100}%;background:${f>=1.1?'var(--good)':f<.9?'var(--bad)':'var(--gold)'}"></i></span><span class="pv">${peso(priceOf(c.id,0))} ${m.tr>0?'<span class="up">▲</span>':m.tr<0?'<span class="dn">▼</span>':'<span class="flat">–</span>'}</span><span class="pn">${inS?'in season':'scarce +15%'}</span></div>`}).join('');
 return`<div class="panel wide">${panelHead('Palengke · Mang Ador','Sell your harvest. Prices change every day.',`<div class="wallet">${peso(S.money)}</div>`)}<div class="pbody mscroll">
 ${cal().wd>=5?'<div class="banner">Market Day! Prices are 10% higher today.</div>':''}
 ${S.orders.length?`<h3>Orders from the town</h3><div class="orders">${S.orders.map(orderCard).join('')}</div>`:''}
 <h3>Your crops</h3>${rows?`<div class="grid">${rows}</div><div class="sellall"><button class="btn pri" data-act="sell-all">Sell everything · ${peso(total)}</button><span class="muted">Selling many of one crop lowers its price for a few days.</span></div>`:'<p class="empty">You have no crops to sell yet. Harvest ripe crops (look for the gold star) and bring them here.</p>'}
 <h3>Today's price board <span class="muted">(Basic grade)</span></h3><div class="pboard">${board}</div></div></div>`;
}

const xpFor=l=>12*(l-1)*(l-1);
function lvlInfo(){const l=lvl(),a=xpFor(l),b=l>=12?a:xpFor(l+1);return{l,a,b,p:b>a?clamp((S.xp-a)/(b-a),0,1):1}}
function itemName(k){const[t,id]=k.split(':');return t==='seed'?CROP[id].name+' seeds':t==='fert'?FERT[id].name:FOOD[id].name}
const POPQ=[];
function levelUp(l){const L=LEVELS[l];if(!L)return;if(L.money)S.money+=L.money;(L.items||[]).forEach(([k,n])=>addItem(k,n));POPQ.push({l});sfx('level');toast(`Level ${l}: ${L.title}!`,'good')}
function popTick(){if(UI||!POPQ.length)return;showLevel(POPQ.shift())}
function showLevel(p){

 openModal('level',()=>`<div class="panel sum"><div class="sunrise"></div><div class="pbody"><p class="kick">Level up!</p><h2>Level ${p.l} · ${L.title}</h2><p class="sub">${L.en}</p>
  <ul class="sumlist">${L.money?`<li>Reward: <b>${peso(L.money)}</b></li>`:''}${(L.items||[]).map(([k,n])=>`<li>Reward: <b>${n} ${itemName(k)}</b></li>`).join('')}<li>Better crop quality: <b>+1.2%</b> quality score</li>
  ${L.unlock?`<li class="gold">New rare crop unlocked: <b>${CROP[L.unlock].name}</b>. Buy the seeds at Aling Nena's.</li>`:''}</ul></div>
  <footer><button class="btn pri" data-act="close">Salamat!</button></footer></div>`,{lock:true});
}

/* ----- Palengke orders: a new one every 3 to 4 days, up to 3 at once ----- */
const WHO=['Aling Rosa','Mang Pedring','Ate Joy','Kuya Ben','Aling Dolor','Chef Mario','Ate Lani','Mang Tonyo','Lola Pilar','Kuya Dodong'];
const pickOf=a=>a[Math.floor(Math.random()*a.length)];
function makeOrder(){
 const L=lvl(),pool=CROPS.filter(c=>(c.lvl||1)<=L),inS=pool.filter(c=>c.seasons.includes(season().id)),c=pickOf(inS.length&&Math.random()<.8?inS:pool);
 const r=Math.random(),minG=L>=5&&r<.15?2:L>=3&&r<.4?1:0,n=clamp(Math.round(260/c.price+2+(Math.random()*2-1)),2,8);
 const money=Math.round(c.price*n*(1.5+.35*minG)*(.9+Math.random()*.3)/5)*5,xp=12+n*2+minG*10;
 const opts=[['fert:organic',2],['fert:complete',1],['seed:'+pickOf(pool).id,3]];if(minG>=1)opts.push(['fert:vermi',1]);
 return{id:++S.ordSeq,crop:c.id,n,minG,who:pickOf(WHO),money,xp,item:Math.random()<.4?pickOf(opts):null,due:S.day+c.days+5+minG*2};
}
function orderTick(notes){
 S.orders=S.orders.filter(o=>{if(o.due<S.day){notes.push(`${o.who}'s order for ${o.n} ${CROP[o.crop].name} expired.`);return false}return true});
 if(S.day>=2&&(S.orders.length===0||(S.orders.length<3&&S.day>=S.ordNext))){const o=makeOrder();S.orders.push(o);S.ordNext=S.day+3+(Math.random()<.5?1:0);notes.push(`New order: ${o.who} wants ${o.n} ${CROP[o.crop].name}. Press G.`)}
}
function orderHave(o){let n=0;for(let g=o.minG;g<=3;g++)n+=inv('crop:'+o.crop+':'+g);return n}
function deliver(id){
 const o=S.orders.find(x=>x.id===id);if(!o)return;if(orderHave(o)<o.n){toast('Not enough crops for this order yet.','bad');sfx('error');return}
 let need=o.n;for(let g=o.minG;g<=3&&need>0;g++){const t=Math.min(need,inv('crop:'+o.crop+':'+g));if(t){addItem('crop:'+o.crop+':'+g,-t);need-=t}}
 S.orders=S.orders.filter(x=>x!==o);S.money+=o.money;S.dayEarn+=o.money;S.stats.orders=(S.stats.orders||0)+1;if(o.item)addItem(o.item[0],o.item[1]);
 sfx('coin');quest('order');toast(`Order delivered to ${o.who}! +${peso(o.money)}`,'good');addXp(o.xp);
}
function orderCard(o){
 const have=orderHave(o),ok=have>=o.n,left=o.due-S.day,c=CROP[o.crop];
 return`<div class="ord ${ok?'ready':''}"><img src="${iconURL('crop:'+o.crop)}" alt=""><div class="ord-main"><b>${o.who} wants ${o.n} ${c.name}${o.minG?` (${GRADES[o.minG].name} or better)`:''}</b>
 <span class="muted">Cooking ${c.dish.split(',')[0].toLowerCase()} · ${left<=0?'last day!':left+' day'+(left>1?'s':'')+' left'}</span>
 <span class="rw"><b>${peso(o.money)}</b><em>+${o.xp} XP</em>${o.item?`<em>+${o.item[1]} ${itemName(o.item[0])}</em>`:''}</span></div>
 <div class="ord-act"><span class="have ${ok?'ok':''}">${Math.min(have,o.n)}/${o.n}</span><button class="btn sm ${ok?'pri':''}" data-act="deliver" data-id="${o.id}" ${ok?'':'disabled'}>Deliver</button></div></div>`;
}

/* ===== 08 AI FARMER: Mang Kiko =====
   Offline brain: rule-based intent matching that reads the live game state (season, weather, crops, money, prices).
   Online hook: set window.GOLDEN_HARVEST_AI_ENDPOINT to your own proxy URL. It receives POST JSON
   { message, history, game, persona } and must answer { reply: "..." }. If it fails or times out,
   the offline brain answers instead, so the game always works without internet. */
const CHAT=[];let AI_MODE='offline';
const AI_CONFIG={endpoint:(typeof window!=='undefined'&&window.GOLDEN_HARVEST_AI_ENDPOINT)||'',timeoutMs:9000};
const PERSONA='You are Mang Kiko, a friendly elderly Filipino farmer in the game Golden Harvest. Answer in short, warm Taglish. Give farming advice using the game state provided. Never invent game rules.';
const QUICK=['What should I plant now?','How is the weather tomorrow?','How do I get Golden grade?','Explain fertilizer','Where can I earn the most?'];
const ALIAS={pechay:['pechay','bok choy','pak choi'],labanos:['labanos','radish'],okra:['okra','lady finger'],sitaw:['sitaw','string bean','yardlong','long bean'],talong:['talong','eggplant','aubergine'],sili:['sili','chili','chilli','labuyo','pepper'],kamatis:['kamatis','tomato'],ampalaya:['ampalaya','bitter gourd','bitter melon'],mais:['mais','corn'],kamote:['kamote','camote','sweet potato'],kalabasa:['kalabasa','squash','pumpkin'],sibuyas:['sibuyas','onion']};
const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}\s\-]/gu,' ').replace(/\s+/g,' ').trim();
const R=(q,re)=>re.test(q);
function findCrop(q){for(const id in ALIAS)for(const a of ALIAS[id])if(new RegExp('(^|\\s)'+a.replace(/[-\s]/g,'[-\\s]?')+'s?(\\s|$)').test(q))return id;return null}
const seasonNames=c=>c.seasons.map(s=>SEASONS.find(x=>x.id===s).name).join(', ');
function greeting(){const h=Math.floor(S.time/60);const w=h<12?'umaga':h<14?'tanghali':h<18?'hapon':'gabi';return`Magandang ${w}, ${S.name}! Ako si Mang Kiko, ang matandang magsasaka dito. Tanungin mo ako tungkol sa pananim, abono, panahon o presyo sa palengke. Ano ang gusto mong malaman?`}
function advisePlant(){
 const se=season(),top=CROPS.filter(c=>(c.lvl||1)<=lvl()&&c.seasons.includes(se.id)).sort((a,b)=>profitPerDay(b)-profitPerDay(a)).slice(0,3);
 let s=`It's ${se.name} (${se.en}). Best crops to plant now:\n`+top.map((c,i)=>`${i+1}. ${c.name}: seed ${peso(c.seed)}, ready in ${c.days} days${c.regrow?`, regrows every ${c.regrow}`:''}, about ${peso(profitPerDay(c))} profit per day.`).join('\n');
 if(S.next==='typhoon')s+='\nPero may bagyo bukas. Mag-ani muna bago magtanim ng bago.';else if(S.money<60)s+=`\nYou only have ${peso(S.money)}, so start with cheap seeds like pechay or okra.`;
 return s;
}
function adviseMoney(){
 const best=CROPS.filter(c=>(c.lvl||1)<=lvl()).sort((a,b)=>profitPerDay(b)-profitPerDay(a)).slice(0,3),se=season();
 return`Highest profit per day overall: ${best.map(c=>`${c.name} (~${peso(profitPerDay(c))}/day)`).join(', ')}.\n`+(best.some(c=>c.seasons.includes(se.id))?`Good news, some of those are in season now (${se.name}).`:`None of those are in season in ${se.name}, so plant the best in-season crop instead: ask me "what should I plant now?"`)+'\nFor more money per crop, use fertilizer to reach Premium or Golden grade, and sell a little each day so prices do not drop.';
}
function adviseCrop(id,q){
 const c=CROP[id],inS=c.seasons.includes(season().id);
 let s=`${c.name} (${c.en}): ${c.desc}\n`;
 s+=`• Grows in ${c.days} days${c.regrow?` and regrows every ${c.regrow} days`:''}\n• Best season: ${seasonNames(c)}${inS?' (in season now)':' (out of season now: slower growth, but sells 15% higher)'}\n• Seed ${peso(c.seed)}, sells around ${peso(c.price)} (today ${peso(priceOf(id,0))} for Basic grade)\n`;
 if(R(q,/ulam|dish|luto|cook|recipe|kain/))s+=`• Famous dishes: ${c.dish}\n`;else s+=`• Tip: ${c.tip}\n`;
 return s.trim();
}
function adviseWeather(){
 const wx=WEATHER[S.weather],nx=WEATHER[S.next];let s=`Ngayon: ${wx.name} (${wx.en}), ${temperature()}°C. ${wx.effect}\nBukas: ${nx.name} (${nx.en}). `;
 if(S.next==='typhoon')s+='Mag-ingat! Mag-ani ng hinog na pananim ngayon, dahil may 22% na tsansa na masira ang bawat tanim.';
 else if(S.next==='storm')s+='Expect heavy rain with thunder from about 1 PM. The rain will water your crops.';
 else if(S.next==='rain')s+='Rain tomorrow, so you can skip the watering can.';
 else if(S.next==='heat')s+='Matinding init bukas. Tools use more energy, so eat a pandesal or turon first.';
 else s+='No rain expected, so water your crops tomorrow.';
 return s;
}
function adviseSeason(q){
 const m=q.match(/init|ulan|lamig/);const se=m?SEASONS.find(s=>s.id===m[0]):season();
 const good=CROPS.filter(c=>(c.lvl||1)<=lvl()&&c.seasons.includes(se.id)).map(c=>c.name).join(', ');
 return`${se.name} (${se.en}) runs ${se.months} in real life. ${se.blurb}\nGood crops: ${good}.\nIn the game each season lasts 28 days and the order is Tag-init, Tag-ulan, Tag-lamig. ${m?'':`Now it is Araw ${cal().sd} of ${se.name}.`}`.trim();
}
const adviseFert=()=>`Fertilizer (abono) raises crop quality:\n${FERTS.map(f=>`• ${f.name}: ${peso(f.price)}. ${f.effect}.`).join('\n')}\nUse the Hoe first, pick the fertilizer from your hotbar, then press Space on the tilled tile. One per tile. Vermicast is the only way to reach Golden grade reliably.`;
const adviseQuality=()=>`Quality grades: Basic ×1, Fine ×1.25, Premium ×1.6, Golden ×2.2 selling price.\nThe score comes from: watering (up to 35 points, the share of growing days your crop was watered or rained on), fertilizer (20, 35 or 50), in-season bonus (up to 10), luck (0 to 15) and a small bonus from your Farming level.\nFine needs 40+, Premium 65+, Golden 90+. So: water every day, plant in season, and use Vermicast.`;
function adviseMarket(){
 const top=CROPS.filter(c=>(c.lvl||1)<=lvl()).sort((a,b)=>priceFactor(b.id)-priceFactor(a.id)).slice(0,3);
 return`Today's best demand: ${top.map(c=>{const p=Math.round((priceFactor(c.id)-1)*100);return`${c.name} (${p>=0?'+':''}${p}%)`}).join(', ')}.\nPrices change every day. Sabado and Linggo are market days with +10%. Do not sell everything at once, because each sale lowers that crop's price for a few days. Higher grades pay much more.`;
}

 ['time',/time|oras|speed|bilis|fast|day length|matulog|sleep|tulog/,()=>'One day lasts about 6 real minutes at 1x. Press T to cycle the speed (1x, 2x, 4x, 8x) or P to pause. Sleep in your bahay kubo (E near the door) to start the next day. If you stay up past midnight you pass out with less energy.'],

function adviseGoals(){const li=lvlInfo(),nx=LEVELS[li.l+1],o=S.orders;
 let t=`You are Farming Level ${li.l}, "${LEVELS[li.l].title}". ${nx?`Next level: ${LEVELS[li.l+1].title} at ${li.b} XP (you have ${S.xp}). You earn XP from harvests, orders and achievements.`:'That is the top level!'}`;
 const lock=CROPS.filter(c=>(c.lvl||1)>li.l)[0];if(lock)t+=`\nRare crop ahead: ${lock.name} unlocks at level ${lock.lvl}.`;
 t+=o.length?`\nOrders open now: ${o.map(x=>`${x.n} ${CROP[x.crop].name}${x.minG?' ('+GRADES[x.minG].name+'+)':''} for ${peso(x.money)}`).join('; ')}. Press G to deliver them.`:'\nNo orders right now. A new one arrives every 3 to 4 days.';
 return t+'\nCheck the Achievements and Collection tabs in Goals (G) for bonus pesos.'}
function kikoOffline(text){
 const q=norm(text);if(!q)return'Ano iyon? Subukan mong tanungin ako tungkol sa pananim o panahon.';
 const crop=findCrop(q);
 if(crop&&!R(q,/fertili|abono|grade|quality/))return adviseCrop(crop,q);
 for(const[,re,fn]of INTENTS)if(R(q,re))return fn(q);
 if(crop)return adviseCrop(crop,q);
 return`Pasensya na, hindi ko pa naiintindihan iyan. Try asking:\n• "What should I plant now?"\n• "How is the weather tomorrow?"\n• "How do I get Golden grade?"\n• "Tell me about talong"\n${nextTask()}`;
}
function aiContext(){const fs=farmStats(),se=season();return{player:S.name,day:cal().sd,season:se.name,weather:S.weather,tomorrow:S.next,hour:Math.floor(S.time/60),money:Math.round(S.money),farm:fs,level:lvl(),inSeasonCrops:CROPS.filter(c=>(c.lvl||1)<=lvl()&&c.seasons.includes(se.id)).map(c=>c.id)}}
async function askKiko(text){
 if(AI_CONFIG.endpoint){
  try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),AI_CONFIG.timeoutMs);
   const r=await fetch(AI_CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:CHAT.slice(-8),game:aiContext(),persona:PERSONA}),signal:ctl.signal});clearTimeout(to);
   if(r.ok){const j=await r.json();if(j&&typeof j.reply==='string'&&j.reply.trim()){AI_MODE='online';return{text:j.reply.trim(),mode:'online'}}}
  }catch(e){}
 }
 await new Promise(r=>setTimeout(r,350+Math.random()*450));
 AI_MODE='offline';return{text:kikoOffline(text),mode:'offline'};
}

/* ===== 09 MAIN: input, game loop, boot ===== */
const KEYMAP={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
function setMouse(e){const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.active=true}
function bindInput(){
 document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='modal'&&UI&&!UI.lock)closeModal();return}
  const fn=ACTS[el.dataset.act];if(fn){audio();fn(el)}
 });
 const unlock=()=>{audio();updateSndBtn()};
 document.addEventListener('pointerdown',unlock,{once:true});document.addEventListener('keydown',unlock,{once:true});
 document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.vol;if(k)setVol(k,+e.target.value/100)});
 document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.vol)sfx('click')});
 updateSndBtn();
 document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='chatin'&&!e.isComposing){e.preventDefault();submitChat()}});
 addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea';
  if(e.code==='Escape'){e.preventDefault();if(UI)closeModal();else if(MODE==='play')openPause();return}
  if(typing)return;
  if(e.code==='KeyM'&&!e.repeat){setMute(!AUD.mute);toast('Sound '+(AUD.mute?'off':'on'));if(UI&&UI.name==='pause')refreshModal();return}
  if(UI){if(e.code==='Enter'&&(UI.name==='summary'||UI.name==='how'))closeModal();return}
  if(MODE!=='play')return;
  const d=KEYMAP[e.code];if(d){keys[d]=true;e.preventDefault();return}
  switch(e.code){
   case'ShiftLeft':case'ShiftRight':keys.run=true;break;
   case'Space':keys.use=true;e.preventDefault();break;
   case'KeyE':if(!e.repeat)interact();break;
   case'KeyQ':if(!e.repeat)cycleItem(-1);break;
   case'KeyF':if(!e.repeat)cycleItem(1);break;
   case'KeyI':openBag();break;
   case'KeyC':e.preventDefault();openChat();break;
   case'KeyB':openEncyclopedia();break;
   case'KeyG':openGoals();break;
   case'KeyT':{const sp=[1,2,4,8],i=sp.indexOf(S.speed);setSpeed(sp[(i+1)%sp.length]);break}
   case'KeyP':setSpeed(S.speed===0?(S.lastSpeed||1):0);break;
   case'KeyM':setMute(!AUD.mute);toast('Sound '+(AUD.mute?'off':'on'));break;
   default:if(e.code.startsWith('Digit')){const n=+e.code.slice(5),idx=HOT.start+n-1;if(n>=1&&n<=9&&idx<hotItems().length){S.sel=idx;hotDirty=true;sfx('click')}}
  }
 });
 addEventListener('keyup',e=>{const d=KEYMAP[e.code];if(d)keys[d]=false;if(e.code==='Space')keys.use=false;if(e.code==='ShiftLeft'||e.code==='ShiftRight')keys.run=false});
 addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
 cv.addEventListener('mousemove',setMouse);
 cv.addEventListener('mouseleave',()=>{mouse.active=false});
 cv.addEventListener('mousedown',e=>{if(MODE!=='play'||UI||e.button!==0)return;audio();setMouse(e);keys.mouse=true;useInput()});
 addEventListener('mouseup',()=>{keys.mouse=false});
 cv.addEventListener('wheel',e=>{if(MODE!=='play'||UI)return;e.preventDefault();cycleItem(e.deltaY>0?1:-1)},{passive:false});
 cv.addEventListener('contextmenu',e=>e.preventDefault());
 addEventListener('beforeunload',()=>{if(MODE==='play')saveGame(true)});
 addEventListener('resize',resize);
 if(window.ResizeObserver)new ResizeObserver(resize).observe($('#stage'));
}

let last=0,T=0,promptT=0;
function update(dt){
 audioTick();
 if(MODE==='play'){
  if(!UI){updatePlayer(dt);advanceTime(dt);updateWorld(dt);popTick()}
  cam.x+=(S.px-cam.x)*Math.min(1,dt*8);cam.y+=(S.py-14-cam.y)*Math.min(1,dt*8);
 }else{
  cam.x=(31+Math.sin(T*.05)*21)*TILE;cam.y=(17+Math.sin(T*.043+1)*3)*TILE;updateWorld(dt);
 }
}
function frame(now){
 const dt=Math.min(.05,((now-last)/1000)||0);last=now;T+=dt;
 try{
  update(dt);render(T,dt);
  if(MODE==='play'){updateHud();promptT+=dt;if(promptT>.08){promptT=0;updatePrompt()}}
  drawMini();
 }catch(err){console.error(err)}
 requestAnimationFrame(frame);
}
function boot(){
 buildSprites();buildWorld();renderBase();SOILSPR.dry=mkSoil(false);SOILSPR.wet=mkSoil(true);initButterflies();
 S=newState();S.time=10*60;S.speed=0;demoFarm(S);
 resize();bindInput();$('#btn-continue').disabled=!hasSave();
 window.__GH={openGoals:openGoals,addXp:addXp,deliver:deliver,checkAch:checkAch,AUD:AUD,ac:()=>AC,rainGain:()=>RAING?RAING.gain.value:-1,fit:()=>FITLOG,S:()=>S,endDay:endDay,startNew:n=>{S=newState(n||'Test');startPlay()},hot:hotItems,useAt:useAt,addItem:addItem,sell:sell,openShop:openShop,openMarket:openMarket,openChat:openChat,kiko:kikoOffline,G:G,SOL:SOL};
 requestAnimationFrame(frame);
}
boot();


})();
